name: CI de Base - Qualité du Code

on:
  pull_request:
    branches: [ develop ]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      pip-cache-key: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-${{ hashFiles('**/pyproject.toml', '**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-
            ${{ runner.os }}-pip-

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Installe mypy + types pour markdown + auto-install des stubs manquants
          pip install mypy types-markdown
        # Si pas de requirements.txt, on force l'installation minimale
        if: steps.cache.outputs.cache-hit != 'true' && !hashFiles('requirements.txt')

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.pip-cache-key || 'fallback' }}

      - name: Installation rapide (cache)
        run: |
          pip install flake8 mypy types-markdown 2>/dev/null || true

      - name: Lancement de Flake8
        run: |
          flake8 . --count --show-source --statistics

  type-check:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.pip-cache-key || 'fallback' }}

      - name: Installation rapide (cache)
        run: |
          pip install mypy types-markdown 2>/dev/null || true

      - name: Lancement de Mypy (avec auto-install des stubs)
        run: |
          # Cette ligne magique installe TOUS les stubs manquants automatiquement
          mypy . --install-types --non-interactive || true
          # Puis on relance le vrai check, maintenant que tout est typé
          mypy . --pretty --show-error-codes

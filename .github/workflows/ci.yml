# .github/workflows/ci.yml

name: CI de Base - Qualité du Code

# Déclencheur : Ce workflow s'exécute à chaque Pull Request vers la branche 'develop'
on:
  pull_request:
    branches: [ develop ]

jobs:
  # JOB 1: SETUP
  # Ce job installe l'environnement et les dépendances.
  # Il va ensuite "passer" les dépendances installées aux autres jobs.
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances et mise en cache
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          # Installez aussi mypy ici pour qu'il soit disponible pour le job type-check
          pip install flake8 mypy fastapi uvicorn pydantic

  # JOB 2: LINT
  # Ce job dépend de 'setup'. Il ne se lancera que si 'setup' réussit.
  # Son unique but est de vérifier la qualité du code avec Flake8.
  lint:
    runs-on: ubuntu-latest
    needs: setup # Dépend du job 'setup'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # On réinstalle les dépendances, mais ce sera très rapide grâce au cache de 'setup'
      - name: Installation des dépendances (depuis le cache)
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy fastapi uvicorn pydantic

      - name: Lancement de Flake8
        run: |
          # --strict fait échouer le job s'il y a le moindre avertissement
          flake8 . --count --show-source --strict

  # JOB 3: TYPE-CHECK
  # Ce job est également dépendant de 'setup'.
  # Il se concentre sur la vérification des types avec Mypy.
  type-check:
    runs-on: ubuntu-latest
    needs: setup # Dépend du job 'setup'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances (depuis le cache)
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy fastapi uvicorn pydantic

      - name: Lancement de Mypy
        run: |
          # --ignore-missing-imports est souvent nécessaire pour les bibliothèques
          # qui n'ont pas de "stubs" de types.
          mypy . --ignore-missing-imports

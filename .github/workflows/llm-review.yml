name: Revue de Code par IA et Notification

on:
  pull_request:
    types: [opened, synchronize]
    branches: [ develop ]

permissions:
  pull-requests: write
  contents: read

jobs:
  review_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Pull Request Diff
        id: get_diff
        run: |
          git diff ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} > pr_diff.txt
          echo "diff_content<<EOF" >> $GITHUB_OUTPUT
          cat pr_diff.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call Gemini API for Code Review
        id: call_llm
        env:
          PROMPT_TEXT: "Tu es un relecteur de code expert en Python et FastAPI. Analyse ce diff. Si le code est bon, fournis des pistes d’amélioration. Si le code contient des bugs ou des mauvaises pratiques, liste-les clairement. Réponds en français et utilise du Markdown pour formater ta réponse."
          DIFF_CONTENT: ${{ steps.get_diff.outputs.diff_content }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          jq -n \
            --arg prompt "$PROMPT_TEXT" \
            --arg diff "$DIFF_CONTENT" \
            '{ "contents": [ { "parts": [ { "text": $prompt }, { "text": $diff } ] } ] }' > payload.json

          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json )

          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "⚠️ Erreur : Impossible d’analyser la réponse de Gemini."')

          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            REVIEW_TEXT="🚨 **Erreur Gemini API** : $ERROR"
          fi

          echo "review_text<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const reviewText = `${{ steps.call_llm.outputs.review_text }}`;
            const reviewBody = `### 🤖 Revue de code par l'IA (Gemini)\n\nBonjour @${{ github.actor }} !\n\nVoici l'analyse automatique des derniers changements :\n\n---\n\n${reviewText}\n\n---\n_Généré par GitHub Actions • ${{ github.workflow }}_`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewBody
            });

      # =================================================================
      # ÉTAPE FINALE : E-MAIL EMPELLI AU FORMAT HTML
      # =================================================================
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🤖 Revue IA • PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          from: GitHub Actions Bot <${{ secrets.MAIL_USERNAME }}>
          # On spécifie le type de contenu
          content_type: text/html
          # On utilise la syntaxe multiligne pour écrire le corps de l'e-mail en HTML
          body: |
            <!DOCTYPE html>
            <html lang="fr">
            <head>
              <meta charset="UTF-8">
              <style>
                body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #333; line-height: 1.6; }
                .container { max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background-color: #f9f9f9; }
                .header { text-align: center; border-bottom: 1px solid #ddd; padding-bottom: 15px; margin-bottom: 20px; }
                .header h1 { margin: 0; color: #24292e; font-size: 24px; }
                .pr-info { margin-bottom: 20px; }
                .pr-info p { margin: 5px 0; }
                .review-box { background-color: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 6px; }
                .review-box h2 { margin-top: 0; font-size: 18px; color: #0366d6; }
                .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #6a737d; }
                .button { display: inline-block; padding: 10px 15px; margin-top: 15px; background-color: #28a745; color: #ffffff; text-decoration: none; border-radius: 5px; }
                pre, code { background-color: #f6f8fa; padding: 2px 4px; border-radius: 3px; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; }
                pre { padding: 16px; overflow: auto; }
              </style>
            </head>
            <body>
              <div class="container">
                <div class="header">
                  <h1>🤖 Revue de Code par l'IA</h1>
                </div>
                <div class="pr-info">
                  <p>Une nouvelle analyse a été générée pour la Pull Request <strong>#${{ github.event.pull_request.number }}</strong>.</p>
                  <p><strong>Auteur :</strong> @${{ github.actor }}</p>
                  <p><strong>Titre :</strong> ${{ github.event.pull_request.title }}</p>
                </div>
                <div class="review-box">
                  <h2>Analyse de Gemini</h2>
                  <pre>${{ steps.call_llm.outputs.review_text }}</pre>
                  <a href="${{ github.event.pull_request.html_url }}" class="button">Voir la Pull Request</a>
                </div>
                <div class="footer">
                  <p>Généré par le workflow "${{ github.workflow }}" • Run #${{ github.run_id }}</p>
                </div>
              </div>
            </body>
            </html>

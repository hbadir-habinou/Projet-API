name: Revue de Code par IA et Notification

on:
  pull_request:
    types: [opened, synchronize]
    branches: [ develop ]

permissions:
  pull-requests: write
  contents: read

jobs:
  review_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Pull Request Diff
        id: get_diff
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"

          git fetch origin $BASE_SHA $HEAD_SHA
          git diff $BASE_SHA..$HEAD_SHA > pr_diff.txt

          echo "diff_content<<EOF" >> $GITHUB_OUTPUT
          cat pr_diff.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call Gemini API for Code Review
        id: call_llm
        env:
          PROMPT_TEXT: "Tu es un relecteur de code expert en Python et FastAPI. Analyse ce diff. Si le code est bon, fournis des pistes d’amélioration. Si le code contient des bugs ou des mauvaises pratiques, liste-les clairement. Réponds en français et utilise du Markdown pour formater ta réponse."
          DIFF_CONTENT: ${{ steps.get_diff.outputs.diff_content }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          jq -n \
            --arg prompt "$PROMPT_TEXT" \
            --arg diff "$DIFF_CONTENT" \
            '{ "contents": [ { "parts": [ { "text": $prompt }, { "text": $diff } ] } ] }' > payload.json

          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json)

          echo "--- RÉPONSE BRUTE GEMINI ---"
          echo "$RESPONSE"
          echo "--- FIN RÉPONSE ---"

          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "⚠️ Erreur : aucune réponse reçue de Gemini."')

          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            REVIEW_TEXT="🚨 **Erreur Gemini API** : $ERROR"
          fi

          REVIEW_TEXT_ESCAPED=$(echo "$REVIEW_TEXT" | sed 's/`/\\`/g' | sed 's/\$/\\$/g')

          echo "review_text<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW_TEXT_ESCAPED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          REVIEW_TEXT: ${{ steps.call_llm.outputs.review_text }}
        with:
          script: |
            const reviewText = process.env.REVIEW_TEXT || "Aucune revue générée.";

            const maxLength = 65536;
            const truncatedText = reviewText.length > maxLength
              ? reviewText.substring(0, maxLength - 200) + "\n\n... (commentaire tronqué, trop long pour GitHub)"
              : reviewText;

            const reviewBody = `### 🤖 Revue de code par l'IA (Gemini)

            Bonjour @${{ github.actor }} !

            Voici l'analyse automatique des derniers changements :

            ---

            ${truncatedText}

            ---
            _Généré par GitHub Actions • ${{ github.workflow }} • Run ${{ github.run_id }}_`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewBody
            });

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🤖 Revue IA • PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          from: GitHub Actions Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            Une nouvelle revue de code a été générée par Gemini pour la Pull Request #${{ github.event.pull_request.number }}.

            👤 Auteur : @${{ github.actor }}
            📝 Titre : ${{ github.event.pull_request.title }}
            🔗 Lien : ${{ github.event.pull_request.html_url }}

            ───────────────────────────────
            Revue IA :
            ───────────────────────────────

            ${{ steps.call_llm.outputs.review_text }}

            ───────────────────────────────
            Généré automatiquement par le workflow GitHub Actions.

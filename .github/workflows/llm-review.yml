name: Revue de Code par IA et Notification

on:
  pull_request:
    types: [opened, synchronize]
    branches: [ develop ]

permissions:
  pull-requests: write

jobs:
  review_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Pull Request Diff
        id: get_diff
        run: |
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > pr_diff.txt
          echo 'diff_content<<EOF' >> $GITHUB_OUTPUT
          cat pr_diff.txt >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Call Gemini API for Code Review
        id: call_llm
        env:
          PROMPT_TEXT: "Tu es un relecteur de code expert en Python et FastAPI. Analyse ce diff. Si le code est bon, fournis des pistes d'amélioration. Si le code contient des bugs ou des mauvaises pratiques, liste-les. Réponds en français et utilise du Markdown pour formater ta réponse."
          DIFF_CONTENT: ${{ steps.get_diff.outputs.diff_content }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # On prépare le corps de la requête (payload) dans un fichier temporaire
          jq -n \
            --arg prompt "$PROMPT_TEXT" \
            --arg diff "$DIFF_CONTENT" \
            '{ "contents": [ { "parts": [ { "text": $prompt }, { "text": $diff } ] } ] }' > payload.json

          # On exécute la requête curl en lisant le payload depuis le fichier
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json )

          # =================================================================
          # LIGNE DE DÉBOGAGE : Affiche la réponse brute de l'API dans les logs
          # =================================================================
          echo "--- DÉBUT DE LA RÉPONSE BRUTE DE L'API ---"
          echo "$RESPONSE"
          echo "--- FIN DE LA RÉPONSE BRUTE DE L'API ---"
          # =================================================================

          # On extrait la réponse de manière sécurisée
          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "Erreur: Impossible d’analyser la réponse de l’IA."')

          # On passe la revue aux étapes suivantes
          echo "review_text<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const reviewBody = `### 🤖 Revue de code par l'IA\n\nBonjour @${{ github.actor }} !\n\nVoici une analyse des derniers changements :\n\n---\n\n${{ steps.call_llm.outputs.review_text }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewBody
            });

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Revue IA pour PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          from: GitHub Actions Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            Une nouvelle revue de code a été générée par l'IA pour la Pull Request #${{ github.event.pull_request.number }}.
            Auteur: @${{ github.actor }}
            Titre: ${{ github.event.pull_request.title }}
            Lien: ${{ github.event.pull_request.html_url }}
            Voici la revue générée :
            ---
            ${{ steps.call_llm.outputs.review_text }}
